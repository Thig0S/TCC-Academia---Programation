<a
  class="atalho-conteudo absolute start-2 top-2 z-10 -translate-y-[200%] rounded-md bg-surface px-4 py-3 text-text focus:translate-y-0 focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-4"
  href="#conteudo"
  >Ir para o conteúdo</a
>
<div class="estrutura min-h-dvh md:grid md:grid-cols-[260px_minmax(0,1fr)]">
  <aside class="barra-lateral flex flex-col gap-4 border-b p-3 md:border-b-0 md:border-r md:p-4">
    <div class="identidade">
      <img class="rounded-lg" src="/imgs/logo-franquia.jpg" alt="" width="800" height="445" />
      <p class="mb-0 mt-3 font-bold">Mercadão dos Óculos - Vendas em Aberto</p>
    </div>
    <app-barra-navegacao />
    <div class="perfil mt-4 border-t border-sidebar-border pt-3 md:mt-auto">
      <p class="mb-1 font-semibold">Administrador</p>
      <p class="mb-2 text-sm text-sidebar-secondary">Perfil estático · sem autenticação</p>
      <a
        class="text-sidebar-text no-underline hover:underline hover:underline-offset-4 focus-visible:underline focus-visible:outline-3 focus-visible:outline-sidebar-focus focus-visible:outline-offset-4"
        routerLink="/configuracoes"
        aria-label="Atalho para Configurações"
        >Configurações da demonstração</a
      >
    </div>
  </aside>
  <div class="area-principal min-w-0">
    <header
      class="barra-superior flex flex-wrap items-center justify-between gap-3 border-b border-border px-3 py-2 md:px-4"
    >
      <span class="text-sm font-semibold">Protótipo navegável</span>
      <button
        type="button"
        class="controle-tema rounded-md border-[1px] border-control-border px-3 py-2 text-sm font-semibold transition-none hover:bg-surface hover:text-text focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-4"
        aria-label="Tema escuro"
        [attr.aria-pressed]="servicoTema.tema() === 'dark'"
        (click)="servicoTema.alternar()"
      >
        Tema ativo: {{ servicoTema.tema() === 'dark' ? 'Escuro' : 'Claro' }}
      </button>
    </header>
    <div class="p-3">
      <p
        class="mb-1 rounded-md border-[1px] border-warning-border bg-warning-bg px-3 py-1 text-sm text-warning-text"
        data-testid="aviso-demonstracao"
      >
        Demonstração com dados fictícios. As alterações são perdidas ao recarregar.
      </p>
      <main id="conteudo" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
