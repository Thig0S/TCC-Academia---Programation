<fieldset class="mb-3 rounded-xl border-[1px] border-border bg-surface p-3 shadow-sm">
  <legend class="text-lg font-semibold">Dados sintéticos do cliente</legend>
  <p class="text-sm text-text-muted">
    Use somente dados inventados. Não informe dados de pessoas reais.
  </p>
  <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="min-w-0 md:col-span-2">
      <label for="nome-cliente" class="mb-1 block text-sm font-medium">Nome</label>
      <input
        id="nome-cliente"
        class="w-full rounded-lg border-[1px] border-control-border bg-surface-muted px-3 py-2 text-text hover:border-brand focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2"
        [formField]="campos().nome"
        aria-describedby="erro-nome"
      />
      <app-erro-campo id="erro-nome" [campo]="campos().nome" />
    </div>
    <div class="min-w-0">
      <label for="cpf-cliente" class="mb-1 block text-sm font-medium">CPF</label>
      <input
        id="cpf-cliente"
        class="w-full rounded-lg border-[1px] border-control-border bg-surface-muted px-3 py-2 text-text hover:border-brand focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2"
        inputmode="numeric"
        [formField]="campos().cpf"
        aria-describedby="erro-cpf"
      />
      <app-erro-campo id="erro-cpf" [campo]="campos().cpf" />
    </div>
    <div class="min-w-0">
      <label for="telefone-cliente" class="mb-1 block text-sm font-medium">Telefone com DDD</label>
      <input
        id="telefone-cliente"
        class="w-full rounded-lg border-[1px] border-control-border bg-surface-muted px-3 py-2 text-text hover:border-brand focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2"
        type="tel"
        [formField]="campos().telefone"
        aria-describedby="erro-telefone"
      />
      <app-erro-campo id="erro-telefone" [campo]="campos().telefone" />
    </div>
    <div class="min-w-0 md:col-span-2">
      <label for="descricao-cliente" class="mb-1 block text-sm font-medium"
        >Descrição (opcional)</label
      >
      <textarea
        id="descricao-cliente"
        class="w-full rounded-lg border-[1px] border-control-border bg-surface-muted px-3 py-2 text-text hover:border-brand focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2"
        rows="3"
        [formField]="campos().descricao"
      ></textarea>
    </div>
  </div>
</fieldset>
