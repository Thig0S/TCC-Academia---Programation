<p
  class="mb-1 text-sm text-text-muted"
  role="status"
  aria-live="polite"
  aria-atomic="true"
  aria-label="Faixa de resultados"
>
  @if (faixa().total === 0) {
    0 resultados
  } @else {
    {{ faixa().inicio }}–{{ faixa().fim }} de {{ faixa().total }} vendas
  }
</p>
@if (totalPaginas() > 1) {
  <nav aria-label="Paginação de vendas">
    <ul class="m-0 flex list-none flex-wrap items-center gap-1 p-0">
      <li>
        <button
          type="button"
          class="min-w-10 rounded-lg border-[1px] border-control-border bg-surface px-3 py-2 text-sm text-text transition-none hover:bg-surface-muted focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2 aria-disabled:cursor-not-allowed aria-disabled:text-text-muted"
          aria-label="Página anterior"
          [attr.aria-disabled]="paginaAtual() === 1"
          (click)="mover(-1)"
        >
          Anterior
        </button>
      </li>
      @for (item of itens(); track $index) {
        <li>
          @if (item === '...') {
            <span class="px-3 py-2 text-sm text-text-muted" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="min-w-10 rounded-lg border-[1px] border-control-border px-3 py-2 text-sm text-text transition-none hover:bg-surface-muted aria-[current=page]:hover:bg-action-hover focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2"
              [class.bg-action]="item === paginaAtual()"
              [class.text-white]="item === paginaAtual()"
              [class.font-semibold]="item === paginaAtual()"
              [class.border-control-border]="item === paginaAtual()"
              [attr.aria-label]="'Página ' + item"
              [attr.aria-current]="item === paginaAtual() ? 'page' : null"
              (click)="irPara(item)"
            >
              {{ item }}
            </button>
          }
        </li>
      }
      <li>
        <button
          type="button"
          class="min-w-10 rounded-lg border-[1px] border-control-border bg-surface px-3 py-2 text-sm text-text transition-none hover:bg-surface-muted focus-visible:outline-3 focus-visible:outline-focus focus-visible:outline-offset-2 aria-disabled:cursor-not-allowed aria-disabled:text-text-muted"
          aria-label="Próxima página"
          [attr.aria-disabled]="paginaAtual() === totalPaginas()"
          (click)="mover(1)"
        >
          Próxima
        </button>
      </li>
    </ul>
  </nav>
}
