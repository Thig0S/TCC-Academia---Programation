<dialog
  #dialog
  class="m-auto w-[min(40rem,calc(100%-2rem))] max-h-[calc(100dvh-2rem)] overflow-auto overflow-wrap-anywhere rounded-xl border-[1px] border-border bg-surface p-5 text-text shadow-2xl"
  aria-labelledby="titulo-modal"
  (cancel)="cancelar($event)"
  (close)="aoFechar()"
  (keydown)="conterFoco($event)"
>
  <h2
    id="titulo-modal"
    class="mb-4 border-b border-border pb-3 text-xl font-semibold tracking-tight"
  >
    {{ titulo() }}
  </h2>
  <div class="conteudo-modal min-w-0"><ng-content /></div>
</dialog>
