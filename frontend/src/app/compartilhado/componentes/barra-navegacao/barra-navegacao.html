<nav aria-label="Navegação principal" class="flex flex-col gap-2">
  @for (modulo of modulos; track modulo.rota) {
    <div routerLinkActive="modulo-ativo" #estado="routerLinkActive">
      <a
        class="nav-link flex items-center gap-3 rounded-lg px-4 py-3 text-sidebar-text transition-none hover:bg-sidebar-hover hover:underline hover:underline-offset-4 focus-visible:outline-3 focus-visible:outline-sidebar-focus focus-visible:outline-offset-4"
        [routerLink]="modulo.rota"
        routerLinkActive="pagina-atual"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <svg
          class="h-6 w-6 shrink-0 fill-none stroke-current [stroke-width:1.8] [stroke-linecap:round] [stroke-linejoin:round]"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path [attr.d]="modulo.icone" />
        </svg>
        {{ modulo.nome }}
      </a>
      @if (modulo.rota === '/vendas' && estado.isActive) {
        <div class="mt-1 flex flex-col gap-2">
          <a
            class="nav-link subdestino ml-6 flex items-center gap-2 border-s-[3px] border-sidebar-focus ps-4 text-sidebar-text hover:bg-sidebar-hover hover:underline hover:underline-offset-4 focus-visible:outline-3 focus-visible:outline-sidebar-focus focus-visible:outline-offset-4"
            routerLink="/vendas/quitadas"
            routerLinkActive="pagina-atual"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <svg
              class="h-4 w-4 shrink-0 fill-none stroke-current [stroke-width:1.8] [stroke-linecap:round] [stroke-linejoin:round]"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="m8 12 2.5 2.5L16 9" />
            </svg>
            <span>Quitadas</span></a
          >
          <a
            class="nav-link subdestino ml-6 flex items-center gap-2 border-s-[3px] border-sidebar-focus ps-4 text-sidebar-text hover:bg-sidebar-hover hover:underline hover:underline-offset-4 focus-visible:outline-3 focus-visible:outline-sidebar-focus focus-visible:outline-offset-4"
            routerLink="/vendas/inativas"
            routerLinkActive="pagina-atual"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <svg
              class="h-4 w-4 shrink-0 fill-none stroke-current [stroke-width:1.8] [stroke-linecap:round] [stroke-linejoin:round]"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M10 9v6m4-6v6" />
            </svg>
            <span>Inativas</span></a
          >
          <a
            class="nav-link subdestino ml-6 flex items-center gap-2 border-s-[3px] border-sidebar-focus ps-4 text-sidebar-text hover:bg-sidebar-hover hover:underline hover:underline-offset-4 focus-visible:outline-3 focus-visible:outline-sidebar-focus focus-visible:outline-offset-4"
            routerLink="/vendas/prejuizo"
            routerLinkActive="pagina-atual"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <svg
              class="h-4 w-4 shrink-0 fill-none stroke-current [stroke-width:1.8] [stroke-linecap:round] [stroke-linejoin:round]"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M10.3 4.7 2.8 18a1.6 1.6 0 0 0 1.4 2.4h15.6a1.6 1.6 0 0 0 1.4-2.4L13.7 4.7a2 2 0 0 0-3.4 0Z"
              />
              <path d="M12 9v4m0 3h.01" />
            </svg>
            <span>Prejuízo</span></a
          >
        </div>
      }
    </div>
  }
</nav>
